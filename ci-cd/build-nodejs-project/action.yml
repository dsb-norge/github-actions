name: "Configure Node.js and build node project"
description: |
  Given the required input this action configures the specified version of node and builds a given project.
  Before npm is invoked the version Node.js specified in 'dsb-build-envs' is installed.
  As for working directory the field 'application-source-path' of 'dsb-build-envs' should point to the base directory of the project.

  Unit tests run between lint and build when the project has them. Which script that is comes from
  package.json — the first of 'test:ci', 'test:unit' or 'test' that exists — so a repo starts running
  its tests in CI as soon as it has any, without a config change. Set 'nodejs-unit-test-script' to a
  script name to override the choice, or to false to skip. Results are published back to the PR when
  the run leaves JUnit XML behind; point 'nodejs-unit-test-results-path' at it if the project writes
  it somewhere other than the defaults.
author: "Direktoratet for samfunnssikkerhet og beredskap"
inputs:
  dsb-build-envs:
    description: |
      DSB build environment variables JSON.
      Required fields:
        See first step.
      Optional fields:
        nodejs-build-project-custom-command-pre-npm-ci
        nodejs-build-project-custom-command-pre-npm-run-lint
        nodejs-build-project-custom-command-pre-npm-run-build
        nodejs-build-project-custom-command-final
        nodejs-unit-test-script
        nodejs-unit-test-results-path
    required: true
outputs:
  sbom-file:
    description: "Path to the generated CycloneDX SBOM file (if any)"
    value: ${{ steps.generate-npm-sbom.outputs.sbom-file }}

runs:
  using: "composite"
  steps:
    # verify we have required inputs in order to avoid blank labels/tags
    - uses: dsb-norge/github-actions/ci-cd/require-build-envs@v4
      with:
        dsb-build-envs: ${{ inputs.dsb-build-envs }}
        require: |
          nodejs-version
          application-source-path
          npmjs-token

    - name: 🦕 Deno install
      shell: bash
      run: deno install
      working-directory: ${{ github.action_path }}/../

    - id: work-dir
      shell: bash
      env:
        INPUT_DSB_BUILD_ENVS: "${{ inputs.dsb-build-envs }}"
        GITHUB_WORKSPACE: "${{ github.workspace }}"
      run: deno run --allow-env --allow-read --allow-write ${{ github.action_path }}/action/1_work-dir.ts

    # set up Node.js
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ fromJSON(inputs.dsb-build-envs).nodejs-version }}
        registry-url: "https://registry.npmjs.org"
      env:
        NODE_AUTH_TOKEN: ${{ fromJSON(inputs.dsb-build-envs).npmjs-token }}

    - id: npm-build
      shell: bash
      working-directory: "${{ steps.work-dir.outputs.abs-path }}"
      env:
        INPUT_DSB_BUILD_ENVS: "${{ inputs.dsb-build-envs }}"
        NODE_AUTH_TOKEN: ${{ fromJSON(inputs.dsb-build-envs).npmjs-token }}
      run: deno run --allow-env --allow-read --allow-write --allow-run=npm ${{ github.action_path }}/action/2_npm-build.ts

    # Where the test run left its JUnit XML. Computed here rather than inline so the default
    # can carry more than one glob without an unreadable expression.
    - id: test-report-glob
      if: ${{ !cancelled() && steps.npm-build.outputs.unit-tests-ran == 'true' }}
      shell: bash
      env:
        CONFIGURED_PATH: "${{ fromJSON(inputs.dsb-build-envs).nodejs-unit-test-results-path }}"
        SOURCE_PATH: "${{ fromJSON(inputs.dsb-build-envs).application-source-path }}"
      run: |
        {
          echo 'glob<<GLOB_EOF'
          if [ -n "${CONFIGURED_PATH}" ]; then
            echo "${CONFIGURED_PATH}"
          else
            echo "${SOURCE_PATH}/**/junit*.xml"
            echo "${SOURCE_PATH}/**/test-results/**/*.xml"
          fi
          echo 'GLOB_EOF'
        } >> "$GITHUB_OUTPUT"

    # Published on failure too — a failed run is exactly when the report is worth reading.
    # Skipped for projects without unit tests, so they get no empty check runs.
    - name: Publish Test Results
      if: ${{ !cancelled() && steps.npm-build.outputs.unit-tests-ran == 'true' }}
      uses: EnricoMi/publish-unit-test-result-action@567cc7f8dcea3eba5da355f6ebc95663310d8a07
      with:
        check_name: "Test Results - ${{ fromJSON(inputs.dsb-build-envs).application-source-path }}"
        files: ${{ steps.test-report-glob.outputs.glob }}
        action_fail_on_inconclusive: false

    - name: Log Test Results
      if: ${{ !cancelled() && steps.npm-build.outputs.unit-tests-ran == 'true' }}
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: "Node.js Test Results - ${{ fromJSON(inputs.dsb-build-envs).application-source-path }}"
        path: ${{ steps.test-report-glob.outputs.glob }}
        reporter: java-junit
        fail-on-empty: "false"

    # generate SBOM for npm project
    - name: "📋 Generate: 📦 npm SBOM"
      id: generate-npm-sbom
      shell: bash
      working-directory: "${{ steps.work-dir.outputs.abs-path }}"
      run: |
        echo "Generating CycloneDX SBOM for npm project ..."
        npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-file sbom.json
        if [ -f "sbom.json" ]; then
          echo "Generated SBOM: ${{ steps.work-dir.outputs.abs-path }}/sbom.json"
          echo "sbom-file=${{ steps.work-dir.outputs.abs-path }}/sbom.json" >> $GITHUB_OUTPUT
        else
          echo "::warning::No SBOM file generated."
          echo "sbom-file=" >> $GITHUB_OUTPUT
        fi

    # SBOM attestation is handled by the downstream docker image action (build-docker-image)
    # which attests the SBOM against the actual Docker image digest
